name: Build Windows EXE
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build + Publish (single step — separate restore/build with different platforms broke XamlCompiler)
        # WinUI 3 REQUIRES x64 platform throughout; restore+build split with --no-restore left stale AnyCPU obj files
        run: dotnet publish NovaControlCenter.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o publish
      - name: Show XAML compiler output on failure
        if: failure()
        run: Get-ChildItem -Recurse obj -Filter output.json | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Raw | Select-Object -First 1 }
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaControlCenter-win-x64
          path: publish/
          if-no-files-found: error
