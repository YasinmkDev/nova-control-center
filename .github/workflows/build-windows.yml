name: Build Windows EXE
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build with VS MSBuild (dotnet CLI hides XamlCompiler errors; MSBuild surfaces them)
        run: msbuild NovaControlCenter.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /v:normal
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaControlCenter-win-x64
          path: bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
