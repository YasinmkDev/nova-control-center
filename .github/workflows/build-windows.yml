name: Build Windows Setup
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained (bundles .NET 8; WinAppSDK self-contained in csproj)
        run: dotnet publish NovaControlCenter.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Download Windows App Runtime 1.6 installer (safety net for client PCs)
        run: Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.6/1.6.250205002/windowsappruntimeinstall-x64.exe" -OutFile "installer/windowsappruntimeinstall-x64.exe"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build setup.exe
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NovaControlCenter.iss'
      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaControlCenter-Setup
          path: installer-output/NovaControlCenter-Setup-1.0.0.exe
          if-no-files-found: error
      - name: Upload self-contained app folder (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: NovaControlCenter-win-x64-selfcontained
          path: publish/
          if-no-files-found: error
