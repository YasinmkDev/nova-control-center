name: Build Windows EXE
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore NovaControlCenter.csproj
      - name: Build
        run: dotnet build NovaControlCenter.csproj -c Release --no-restore
      - name: Publish unpackaged exe
        run: dotnet publish NovaControlCenter.csproj -c Release -r win-x64 --self-contained false -o publish
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaControlCenter-win-x64
          path: publish/
          if-no-files-found: error
